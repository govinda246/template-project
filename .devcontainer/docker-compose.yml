name: secure-phaser-template

services:
  devcontainer:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    init: true
    user: node
    volumes:
      - ..:/workspaces/github_agent_test:cached
      - agent-session-history:/home/node/.vscode-server/data/User/workspaceStorage
    networks:
      - sandbox
    security_opt:
      - no-new-privileges:true
      - seccomp=./bubblewrap-seccomp.json
    cap_drop:
      - ALL
    cpus: "2.0"
    mem_limit: 4g
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    devices:
      - /dev/net/tun:/dev/net/tun

  egress-proxy:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command:
      - node
      - /opt/secure-template/egress-proxy.mjs
    init: true
    user: node
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - sandbox
      - egress
    expose:
      - "3128"
      - "3000"
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      FRONTEND_PROXY_TARGET: devcontainer
      FRONTEND_PROXY_PORT: "3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: "0.5"
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  agent-session-history:

networks:
  sandbox:
    internal: true
  egress: {}
