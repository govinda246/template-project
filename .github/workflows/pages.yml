name: Deploy container guide to Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  # Pages artifactの作成・OIDC deployだけに必要な権限。
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # 供給網リスクを減らすため、利用Actionはcommit SHAへ固定する。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify shared Agent pin before checkout
        run: node scripts/verify-shared-agent.mjs --pre-checkout
      - name: Checkout pinned shared Agent
        run: |
          git submodule update --init --recursive
          node scripts/verify-shared-agent.mjs
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - name: Upload pages artifact
        # 公開対象はdocsだけ。リポジトリ全体や秘密を含むworkspaceをartifactにしない。
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
