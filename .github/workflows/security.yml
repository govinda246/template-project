name: Dependency security audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  # 読み取りと監査結果の実行だけに必要な権限へ限定する。
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # タグではなくcommit SHA固定でAction内容の追従変更を防ぐ。
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install dependencies without lifecycle scripts
        # 取得パッケージのinstall scriptは先に実行せず、lockfileから導入する。
        run: npm ci --ignore-scripts
      - name: Audit production dependencies
        # 本番依存と報告面を分離して確認する。
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies
        # Vite/Vitest等の開発時実行コードもHigh以上を許可しない。
        run: npm audit --audit-level=high
      - name: Run tests
        run: npm test
      - name: Run proxy security tests
        run: node --test .devcontainer/egress-proxy.test.mjs
      - name: Verify resolved Compose security controls
        run: node scripts/verify-compose-security.mjs
      - name: Build
        run: npm run build
      - name: Verify lockfile
        run: npm ci --ignore-scripts
