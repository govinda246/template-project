name: Dependency security audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  # 読み取りと監査結果の実行だけに必要な権限へ限定する。
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # タグではなくcommit SHA固定でAction内容の追従変更を防ぐ。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify shared Agent pin before checkout
        run: node scripts/verify-shared-agent.mjs --pre-checkout
      - name: Checkout pinned shared Agent
        run: |
          git submodule update --init --recursive
          node scripts/verify-shared-agent.mjs
      - name: Synchronize shared Agent files
        run: node scripts/sync-shared-agent.mjs
      - name: Install dependencies without lifecycle scripts
        # 取得パッケージのinstall scriptは先に実行せず、lockfileから導入する。
        run: npm ci --ignore-scripts
      - name: Audit production dependencies
        # 本番依存と報告面を分離して確認する。
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies
        # Vite/Vitest等の開発時実行コードもHigh以上を許可しない。
        run: npm audit --audit-level=high
      - name: Scan repository for misconfiguration and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret
          skip-dirs: .git,node_modules
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: "1"
          format: sarif
          output: trivy-repository-security.sarif
      - name: Generate dependency vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          skip-dirs: .git,node_modules
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table
          output: trivy-dependencies.txt
      - name: Build Dev Container image for scanning
        run: docker build -f .devcontainer/Dockerfile -t secure-template-devcontainer:ci .
      - name: Scan Dev Container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: secure-template-devcontainer:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table
          output: trivy-devcontainer.txt
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: .git,node_modules
          format: cyclonedx
          output: trivy-sbom.cdx.json
      - name: Block fixable dependency vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          skip-dirs: .git,node_modules
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          output: trivy-fixable-dependencies.txt
      - name: Block fixable Dev Container vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: secure-template-devcontainer:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          output: trivy-fixable-devcontainer.txt
      - name: Upload Trivy reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-reports
          path: |
            trivy-repository-security.sarif
            trivy-dependencies.txt
            trivy-fixable-dependencies.txt
            trivy-devcontainer.txt
            trivy-fixable-devcontainer.txt
            trivy-sbom.cdx.json
          if-no-files-found: warn
          retention-days: 30
      - name: Run tests
        run: npm test
      - name: Run bootstrap tests
        run: node --test scripts/init-project.test.mjs scripts/setup-shared-agent.test.mjs scripts/sync-shared-agent.test.mjs scripts/verify-shared-agent.test.mjs scripts/verify-trivy-policy.test.mjs
      - name: Run proxy security tests
        run: node --test .devcontainer/egress-proxy.test.mjs .devcontainer/dns-filter.test.mjs
      - name: Verify resolved Compose security controls
        run: node scripts/verify-compose-security.mjs
      - name: Verify Bubblewrap seccomp policy
        run: node scripts/verify-bubblewrap-security.mjs
      - name: Verify effective Copilot and VS Code settings
        run: node --test scripts/verify-vscode-settings.test.mjs
      - name: Test egress audit parser
        run: node --test scripts/audit-egress-logs.test.mjs
      - name: Verify repository VS Code settings
        run: node scripts/verify-vscode-settings.mjs
      - name: Verify DNS containment in Compose
        run: node scripts/verify-dns-security.mjs
      - name: Build
        run: npm run build
      - name: Verify lockfile
        run: npm ci --ignore-scripts
